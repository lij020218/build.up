<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f5f5f7"/>

  <!-- Midnight gradient accent -->
  <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#191970" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#191970" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- App icon -->
  <rect x="80" y="80" width="96" height="96" rx="24" fill="#191970"/>
  <text x="128" y="148" font-family="-apple-system, Helvetica, sans-serif"
        font-size="52" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-0.04em">b.</text>

  <!-- Brand name -->
  <text x="200" y="127" font-family="-apple-system, Helvetica, sans-serif"
        font-size="42" font-weight="700" fill="#191970" letter-spacing="-0.025em">Found.One</text>
  <text x="200" y="160" font-family="-apple-system, Helvetica, sans-serif"
        font-size="18" font-weight="500" fill="rgba(15,23,42,0.5)">창업 로드맵 멘토링</text>

  <!-- Main headline -->
  <text x="80" y="280" font-family="-apple-system, Helvetica, sans-serif"
        font-size="64" font-weight="750" fill="#0f172a" letter-spacing="-0.03em">예비 창업자를 위한</text>
  <text x="80" y="355" font-family="-apple-system, Helvetica, sans-serif"
        font-size="64" font-weight="750" fill="#191970" letter-spacing="-0.03em">AI 올인원 멘토링</text>

  <!-- Sub description -->
  <text x="80" y="415" font-family="-apple-system, Helvetica, sans-serif"
        font-size="24" font-weight="400" fill="rgba(15,23,42,0.6)">단계별 창업 로드맵 · 세무·자금·입지 분석 · 지원사업 자동 매칭</text>

  <!-- Feature pills -->
  <rect x="80" y="460" width="160" height="44" rx="22" fill="rgba(25,25,112,0.08)"/>
  <text x="160" y="487" font-family="-apple-system, Helvetica, sans-serif"
        font-size="16" font-weight="600" fill="#191970" text-anchor="middle">🗺️ 로드맵</text>

  <rect x="256" y="460" width="160" height="44" rx="22" fill="rgba(25,25,112,0.08)"/>
  <text x="336" y="487" font-family="-apple-system, Helvetica, sans-serif"
        font-size="16" font-weight="600" fill="#191970" text-anchor="middle">📊 경영 분석</text>

  <rect x="432" y="460" width="160" height="44" rx="22" fill="rgba(25,25,112,0.08)"/>
  <text x="512" y="487" font-family="-apple-system, Helvetica, sans-serif"
        font-size="16" font-weight="600" fill="#191970" text-anchor="middle">💰 지원사업</text>

  <rect x="608" y="460" width="160" height="44" rx="22" fill="rgba(25,25,112,0.08)"/>
  <text x="688" y="487" font-family="-apple-system, Helvetica, sans-serif"
        font-size="16" font-weight="600" fill="#191970" text-anchor="middle">🤖 AI 코치</text>

  <!-- Right side decoration -->
  <rect x="900" y="120" width="220" height="380" rx="24" fill="white"
        style="filter: drop-shadow(0 8px 32px rgba(25,25,112,0.12))"/>
  <rect x="916" y="140" width="188" height="8" rx="4" fill="rgba(25,25,112,0.08)"/>
  <rect x="916" y="160" width="140" height="8" rx="4" fill="rgba(25,25,112,0.05)"/>
  <rect x="916" y="188" width="188" height="60" rx="12" fill="rgba(25,25,112,0.04)"/>
  <rect x="916" y="260" width="188" height="40" rx="12" fill="rgba(25,25,112,0.04)"/>
  <rect x="916" y="312" width="188" height="40" rx="12" fill="rgba(25,25,112,0.04)"/>
  <rect x="916" y="364" width="120" height="36" rx="18" fill="#191970"/>
  <text x="976" y="387" font-family="-apple-system, Helvetica, sans-serif"
        font-size="13" font-weight="600" fill="white" text-anchor="middle">시작하기 →</text>

  <!-- URL -->
  <text x="80" y="590" font-family="-apple-system, Helvetica, sans-serif"
        font-size="18" font-weight="500" fill="rgba(15,23,42,0.4)">foundone.dev</text>
</svg>
