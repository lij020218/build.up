name: FoundOne
options:
  bundleIdPrefix: com.foundone
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ko
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

# ─────────────────────────────────────────────────────────────────
# Local Swift Package — 본 디렉토리(apps/ios) 의 Sources/* 모듈
# ─────────────────────────────────────────────────────────────────
packages:
  FoundOne:
    path: .

# ─────────────────────────────────────────────────────────────────
# App Target
# ─────────────────────────────────────────────────────────────────
targets:
  FoundOne:
    type: application
    platform: iOS
    deploymentTarget: "18.0"

    configFiles:
      Debug: Config/Build.xcconfig
      Release: Config/Build.xcconfig

    sources:
      - path: App/FoundOne
        type: group
        excludes:
          - Info.plist
          - FoundOne.entitlements   # 서명 입력물 — 번들에 리소스로 들어가면 안 됨

    dependencies:
      - package: FoundOne
        product: FoundOneDesignSystem
      - package: FoundOne
        product: FoundOneCore
      - package: FoundOne
        product: FoundOneComponents
      - package: FoundOne
        product: FoundOneData
      - package: FoundOne
        product: FoundOneAuth
      - package: FoundOne
        product: FoundOneNotifications
      - package: FoundOne
        product: FoundOneFeatures

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foundone.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon  # App/FoundOne/Assets.xcassets/AppIcon.appiconset
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
        INFOPLIST_FILE: App/FoundOne/Info.plist
        # ── 코드 서명 ──────────────────────────────────────────────
        # 시뮬레이터는 서명이 필요 없다("-"). 실기기·아카이브만 실제 인증서를 쓴다.
        # 이렇게 SDK 로 갈라두지 않으면 둘 중 하나가 반드시 깨진다:
        #   base 를 "-" 로 고정 → 아카이브 불가 (종전 상태)
        #   base 를 인증서로   → 팀 미설정 상태에서 시뮬레이터 빌드까지 실패
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/FoundOne/FoundOne.entitlements
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        # Live Activity / Widget Extension entitlements 는 추후 Widget target 추가 시
      # 실기기(iphoneos) identity 는 지정하지 않는다 — Automatic 서명에서 수동 지정은
      # "conflicting provisioning settings" 아카이브 실패를 부른다 (2026-08-06 실측).
      # 아카이브는 Apple Development 로 서명되고, exportArchive(app-store-connect) 가
      # Distribution 으로 자동 재서명한다. DEVELOPMENT_TEAM 은 Config/Build.xcconfig.
