name: BuildUp
options:
  bundleIdPrefix: com.buildup
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ko
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

# ─────────────────────────────────────────────────────────────────
# Local Swift Package — 본 디렉토리(apps/ios) 의 Sources/* 모듈
# ─────────────────────────────────────────────────────────────────
packages:
  BuildUp:
    path: .

# ─────────────────────────────────────────────────────────────────
# App Target
# ─────────────────────────────────────────────────────────────────
targets:
  BuildUp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"

    configFiles:
      Debug: Config/Build.xcconfig
      Release: Config/Build.xcconfig

    sources:
      - path: App/BuildUp
        type: group
        excludes:
          - Info.plist

    dependencies:
      - package: BuildUp
        product: BuildUpDesignSystem
      - package: BuildUp
        product: BuildUpCore
      - package: BuildUp
        product: BuildUpComponents
      - package: BuildUp
        product: BuildUpData
      - package: BuildUp
        product: BuildUpAuth
      - package: BuildUp
        product: BuildUpNotifications
      - package: BuildUp
        product: BuildUpFeatures

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buildup.mobile
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"  # 시뮬레이터용 unsigned
        INFOPLIST_FILE: App/BuildUp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        # Live Activity / Widget Extension entitlements 는 추후 Widget target 추가 시
