name: FoundOne
options:
  bundleIdPrefix: com.foundone
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ko
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

# ─────────────────────────────────────────────────────────────────
# Local Swift Package — 본 디렉토리(apps/ios) 의 Sources/* 모듈
# ─────────────────────────────────────────────────────────────────
packages:
  FoundOne:
    path: .

# ─────────────────────────────────────────────────────────────────
# App Target
# ─────────────────────────────────────────────────────────────────
targets:
  FoundOne:
    type: application
    platform: iOS
    deploymentTarget: "18.0"

    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Build.xcconfig

    sources:
      - path: App/FoundOne
        type: group
        excludes:
          - Info.plist

    dependencies:
      - package: FoundOne
        product: FoundOneDesignSystem
      - package: FoundOne
        product: FoundOneCore
      - package: FoundOne
        product: FoundOneComponents
      - package: FoundOne
        product: FoundOneData
      - package: FoundOne
        product: FoundOneAuth
      - package: FoundOne
        product: FoundOneNotifications
      - package: FoundOne
        product: FoundOneFeatures

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foundone.mobile
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"  # 시뮬레이터용 unsigned
        INFOPLIST_FILE: App/FoundOne/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        # Live Activity / Widget Extension entitlements 는 추후 Widget target 추가 시
